<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Калькулятор стоимости заказа</title>
    <script src="calculator.js" defer></script>
</head>
<body>
    <h1>Калькулятор стоимости заказа</h1>
    <form>
        <p>
            <label for="quantity">Количество:</label>
            <input id="quantity" name="quantity" type="text">
        </p>
        <p>
            <label for="product">Товар:</label>
            <select id="product" name="product">
                <option value="100">Карандаш — 100 руб.</option>
                <option value="250">Блокнот — 250 руб.</option>
                <option value="1200">Рюкзак — 1200 руб.</option>
            </select>
        </p>
        <p>
            <button id="calc-button" type="submit">Рассчитать</button>
        </p>
    </form>
    <div id="error"></div>
    <div id="result"></div>
</body>
</html>
